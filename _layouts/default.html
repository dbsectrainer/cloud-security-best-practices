<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {%- if page.hero -%} {%- if page.title -%}{{ page.title }}{%- else -%}{{
      site.title }}{%- endif -%} {%- elsif page.title -%} {{ page.title }} - {{
      site.title }} {%- else -%} {{ site.title }} {%- endif -%}
    </title>
    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}Comprehensive cloud security strategies, frameworks, and implementation guides for senior engineers, managers, and executives.{% endif %}"
    />

    <!-- SEO Tags -->
    {% seo %}

    <!-- Stylesheets -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Mermaid for Diagrams (Rouge emits code.language-mermaid; Mermaid expects div.mermaid) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        mermaid.initialize({
          startOnLoad: false,
          theme: "default",
          themeVariables: {
            primaryColor: "#159957",
            primaryTextColor: "#fff",
            primaryBorderColor: "#0d7042",
            lineColor: "#155799",
            secondaryColor: "#f6f8fa",
            tertiaryColor: "#fafbfc",
          },
        });

        (async function () {
          var nodeList = document.querySelectorAll(
            "pre code.language-mermaid, pre code.language-mmd",
          );
          var nodes = [];
          nodeList.forEach(function (codeEl) {
            var diagram = codeEl.textContent;
            var pre = codeEl.parentElement;
            if (!pre || pre.tagName !== "PRE") return;
            var container =
              pre.closest("div.highlighter-rouge") ||
              pre.closest(".highlight") ||
              pre;
            var mermaidEl = document.createElement("div");
            mermaidEl.className = "mermaid";
            mermaidEl.textContent = diagram;
            container.replaceWith(mermaidEl);
            nodes.push(mermaidEl);
          });
          if (nodes.length) {
            await mermaid.run({ nodes: nodes });
          }
        })();
      });
    </script>
  </head>
  <body>
    {% include nav.html %} {% if page.hero %} {% include hero.html %}
    <main>{{ content }}</main>
    {% else %}
    <!-- Page Header -->
    <header class="header">
      <div class="container">
        <h1>{{ page.title | default: site.title }}</h1>
      </div>
    </header>

    <!-- Main Content -->
    <main
      class="container"
      style="padding: 3rem 2rem; max-width: 1280px; margin: 0 auto"
    >
      {{ content }}
    </main>
    {% endif %} {% include footer.html %}

    <!-- JavaScript -->
    <script>
      // Simple dropdown functionality
      document.querySelectorAll(".dropdown-toggle").forEach((toggle) => {
        toggle.addEventListener("click", function (e) {
          e.preventDefault();
          const parent = this.parentElement;
          parent.classList.toggle("active");
        });
      });

      // Close dropdowns when clicking outside
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".dropdown")) {
          document.querySelectorAll(".dropdown.active").forEach((dropdown) => {
            dropdown.classList.remove("active");
          });
        }
      });

      // Smooth scroll for anchor links
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          const href = this.getAttribute("href");
          if (href !== "#") {
            e.preventDefault();
            const target = document.querySelector(href);
            if (target) {
              target.scrollIntoView({
                behavior: "smooth",
                block: "start",
              });
            }
          }
        });
      });
    </script>
  </body>
</html>
