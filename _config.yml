title: Cloud Security Best Practices
description: Comprehensive cloud security strategies, frameworks, and implementation guides for senior engineers, managers, and executives. Multi-cloud security across AWS, Azure, and GCP.
baseurl: "/cloud-security-best-practices"
url: "https://dbsectrainer.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax

# Default layout
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Convert Markdown files to HTML
include:
  - IMPLEMENTATION_GUIDE.md
  - SECURITY_FRAMEWORK.md
  - COMPLIANCE.md
  - ARCHITECTURE_AND_DIAGRAMS.md
  - TESTING_GUIDE.md
  - INNOVATION.md
  - RISK_MANAGEMENT.md
  - DISASTER_RECOVERY.md
  - INCIDENT_RESPONSE_PLAN.md
  - VENDOR_SECURITY_ASSESSMENT.md
  - SECURITY_TRAINING_GUIDE.md

relative_links:
  enabled: true
  collections: true

# SEO & Social
twitter:
  card: summary_large_image
social:
  name: Cloud Security Best Practices
  links:
    - https://github.com/dbsectrainer/cloud-security-best-practices

# Analytics
google_analytics: # Add your Google Analytics tracking ID
